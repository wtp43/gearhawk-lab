apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert-dataflarelabs
  namespace: gateway
spec:
  dnsNames:
    - "*.dataflarelabs.com"
    - "dataflarelabs.com"
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: cloudflare-cluster-issuer
  secretName: cert-dataflarelabs
  usages:
    - digital signature
    - key encipherment
