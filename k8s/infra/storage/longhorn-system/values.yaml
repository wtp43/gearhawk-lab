# issue: https://github.com/longhorn/longhorn/issues/4853
preUpgradeChecker:
  # -- Setting that allows Longhorn to perform pre-upgrade checks. Disable this setting when installing Longhorn using Argo CD or other GitOps solutions.
  jobEnabled: false
persistence:
  defaultClass: true
  defaultFsType: ext4
  defaultMkfsParams: ""
  defaultClassReplicaCount: 2
defaultNodeSelector:
  enable: false # disable by default
  selector: []

defaultSettings:
  createDefaultDiskLabeledNodes: true

defaultBackupStore:
  # S3 backups disabled for the egress freeze; restore in 2026-09.
  # -- Endpoint used to access the default backupstore.
  backupTarget: ""
  # backupTarget: s3://gearhawk-longhorn@us-east-2/
  # -- Name of the Kubernetes secret associated with the default backup target.
  backupTargetCredentialSecret: ""
  # backupTargetCredentialSecret: s3-aws-secret
