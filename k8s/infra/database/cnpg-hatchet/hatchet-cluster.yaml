apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: hatchet-pg-cluster
  namespace: cnpg-hatchet
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  imagePullPolicy: IfNotPresent
  instances: 2
  startDelay: 300
  stopDelay: 300
  primaryUpdateStrategy: unsupervised

  postgresql:
    # TODO: performance tuning https://www.enterprisedb.com/postgres-tutorials/introduction-postgresql-performance-tuning-and-optimization?lang=en
    # using: https://pgtune.leopard.in.ua/
    # WARNING: WAL tuning parameters should be the same as the backups

    # additional tunning for hatchet db's https://docs.hatchet.run/self-hosting/improving-performance
    parameters:
      timezone: "Etc/UTC"
      max_connections: "1500"
      shared_buffers: "2GB"
      effective_cache_size: "6GB"
      maintenance_work_mem: "512MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "1390kB"
      huge_pages: "off"
      min_wal_size: "1GB"
      max_wal_size: "4GB"
      max_worker_processes: "8"
      max_parallel_workers_per_gather: "4"
      max_parallel_workers: "8"
      max_parallel_maintenance_workers: "4"

  enableSuperuserAccess: true
  superuserSecret:
    name: gearhawk-postgres-superuser

  affinity:
    enablePodAntiAffinity: true
    # preferred until the volumes are migrated off work-00: all three instances are
    # there now, so required would leave any recreated pod unschedulable.
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname

  storage:
    storageClass: no-replicas
    size: 30Gi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: r2-store
        serverName: hatchet-cnpg-2026-09-02

  resources:
    requests:
      memory: "8Gi"
      cpu: "2"
    limits:
      memory: "16Gi"
  monitoring:
    enablePodMonitor: false

  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: false
