# 1Password item "kaneo-owner" (vault gearhawk-k8s), also synced into the kaneo
# namespace. Fields:
#   username  kaneo
#   password  hex only (openssl rand -hex 32) so it needs no escaping in the URI
#   uri       postgresql://kaneo:<password>@kaneo-cluster-rw.cnpg-kaneo.svc.cluster.local:5432/kaneo
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: kaneo-owner
  namespace: cnpg-kaneo
  labels:
    cnpg.io/reload: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  itemPath: "vaults/gearhawk-k8s/items/kaneo-owner"
type: kubernetes.io/basic-auth
