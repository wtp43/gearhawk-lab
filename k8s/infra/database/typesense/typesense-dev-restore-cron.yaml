# Repopulates the dev Typesense cluster from prod whenever dev comes back empty
# (PVC lost, cluster recreated, collections dropped).
#
# The job is a no-op when dev already holds documents, so it is safe to run on a
# schedule. To force a full refresh of dev against current prod data:
#
#   kubectl create job -n typesense typesense-dev-refresh \
#     --from=cronjob/typesense-dev-restore
#   kubectl set env -n typesense job/typesense-dev-refresh FORCE=1   # before it starts
#
# or simply delete the dev collections and wait for the next scheduled run.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: typesense-dev-restore
  namespace: typesense
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 4Gi
          containers:
            - name: restore
              image: python:3.12-alpine
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 512Mi
              env:
                - name: SRC
                  value: http://typesense-cluster-svc:8108
                - name: DST
                  value: http://typesense-dev-svc:8108
                - name: TS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: typesense-api-key
                      key: typesense-api-key
              volumeMounts:
                - name: work
                  mountPath: /work
              command: ["python3", "-u", "-c"]
              args:
                - |
                  import json, os, shutil, urllib.request, urllib.error

                  SRC, DST, KEY = os.environ["SRC"], os.environ["DST"], os.environ["TS_KEY"]
                  FORCE = os.environ.get("FORCE") == "1"
                  HDR = {"X-TYPESENSE-API-KEY": KEY}
                  DOCS = "/work/docs.jsonl"

                  def call(url, method="GET", body=None, ctype=None, out=None):
                      h = dict(HDR)
                      if ctype:
                          h["Content-Type"] = ctype
                      req = urllib.request.Request(url, data=body, headers=h, method=method)
                      with urllib.request.urlopen(req, timeout=300) as r:
                          if out:                      # stream straight to disk
                              with open(out, "wb") as f:
                                  shutil.copyfileobj(r, f, 1 << 20)
                              return None
                          return r.read()

                  def js(url):
                      return json.loads(call(url))

                  src_cols = [c["name"] for c in js(f"{SRC}/collections?exclude_fields=fields")]

                  # Guard: only restore collections that are absent or empty on dev.
                  # A dev cluster that is merely still booting is not an error - the
                  # next scheduled run will pick it up.
                  try:
                      dev = {c["name"]: c["num_documents"]
                             for c in js(f"{DST}/collections?exclude_fields=fields")}
                  except (urllib.error.URLError, OSError) as e:
                      print(f"dev unreachable ({e}); skipping this run")
                      raise SystemExit(0)

                  if FORCE:
                      targets = src_cols
                      print(f"FORCE set, restoring all: {targets}")
                  else:
                      targets = [c for c in src_cols if not dev.get(c)]
                      if not targets:
                          print(f"dev already populated {dev}; nothing to restore")
                          raise SystemExit(0)
                      print(f"dev missing or empty: {targets}")

                  for name in targets:
                      print(f"=== {name}")

                      # 1. clone the schema, minus server-managed and auto-generated fields
                      schema = js(f"{SRC}/collections/{name}")
                      for k in ("created_at", "num_documents", "num_memory_shards"):
                          schema.pop(k, None)
                      schema["fields"] = [f for f in schema.get("fields", [])
                                          if not f["name"].startswith(".")]

                      # 2. recreate the collection on dev
                      try:
                          call(f"{DST}/collections/{name}", method="DELETE")
                      except urllib.error.HTTPError as e:
                          if e.code != 404:
                              raise
                      call(f"{DST}/collections", method="POST",
                           body=json.dumps(schema).encode(), ctype="application/json")

                      # 3. export prod docs to disk, then bulk-import into dev
                      call(f"{SRC}/collections/{name}/documents/export", out=DOCS)
                      size = os.path.getsize(DOCS)
                      with open(DOCS, "rb") as f:
                          n = sum(1 for _ in f)
                      print(f"exported {n} docs ({size / 1e6:.1f} MB)")

                      with open(DOCS, "rb") as f:
                          req = urllib.request.Request(
                              f"{DST}/collections/{name}/documents/import"
                              "?action=create&batch_size=2000",
                              data=f, method="POST",
                              headers={**HDR, "Content-Type": "text/plain",
                                       "Content-Length": str(size)})
                          fails = []
                          with urllib.request.urlopen(req, timeout=900) as r:
                              for line in r:
                                  res = json.loads(line)
                                  if not res.get("success") and len(fails) < 3:
                                      fails.append(res)
                      print(f"imported, failures: {len(fails)}")
                      for f_ in fails:
                          print(f"  {f_}")
                      os.remove(DOCS)

                  # 4. mirror aliases
                  for a in js(f"{SRC}/aliases").get("aliases", []):
                      call(f"{DST}/aliases/{a['name']}", method="PUT",
                           body=json.dumps({"collection_name": a["collection_name"]}).encode(),
                           ctype="application/json")
                      print(f"alias {a['name']} -> {a['collection_name']}")

                  print("done")
