apiVersion: ts.opentelekomcloud.com/v1alpha1
kind: TypesenseCluster
metadata:
  labels:
    app.kubernetes.io/name: typesense-operator
    app.kubernetes.io/managed-by: kustomize
  name: typesense-dev
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  image: typesense/typesense:29.0
  replicas: 1
  storage:
    size: 5Gi
    storageClassName: no-replicas
  enableCors: true
  # Exact origins, comma-separated -- Typesense's --cors-domains has no port or
  # wildcard matching, so every local port has to be spelled out.
  corsDomains: "https://dev.gearhawk.io,http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:3005"

  # Its own key, not prod's: the dev web app hands this to the browser, so it
  # must not be able to touch the prod cluster.
  adminApiKey:
    name: typesense-dev-api-key
  resources:
    limits:
      memory: 4Gi
      cpu: 4
