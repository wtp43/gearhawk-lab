grpc:
  replicaCount: 3
  envFrom:
    - secretRef:
        name: hatchet-config
controllers:
  replicaCount: 2
  envFrom:
    - secretRef:
        name: hatchet-config
scheduler:
  replicaCount: 2
  envFrom:
    - secretRef:
        name: hatchet-config
  # A queue refill reads 2 x this many items (default 100). Behind a 200-item head of one rate-limited vendor, the
  # other vendors' runs waited while http slots sat idle (memx run, 2026-11-27).
  env:
    SERVER_SINGLE_QUEUE_LIMIT: "5000"
  # No CPU limit: the active scheduler used about one core under that load.
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      memory: 4Gi
sharedConfig:
  # you can disable shared config by setting this to false
  enabled: true
  # you can set additional environment variables here, which will override any defaults
  envFrom:
    - secretRef:
        name: hatchet-config
postgres:
  enabled: false
rabbitmq:
  enabled: false
api:
  envFrom:
    - secretRef:
        name: hatchet-config

frontend:
  resources:
    limits:
      memory: 4096Mi
