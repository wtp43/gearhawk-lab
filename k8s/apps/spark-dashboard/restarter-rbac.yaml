apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-dashboard-restarter
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["spark-dashboard"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-dashboard-restarter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-dashboard-restarter
subjects:
  - kind: ServiceAccount
    name: spark-dashboard-restarter
    namespace: vllm-openai
