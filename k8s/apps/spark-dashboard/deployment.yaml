apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-dashboard
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: spark-dashboard
  template:
    metadata:
      labels:
        app: spark-dashboard
    spec:
      serviceAccountName: spark-dashboard
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: work-00
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spark-dashboard
          image: ghcr.io/niklasfrick/spark-dashboard:v0.16.0@sha256:1d5dd997466769b7a2572b36405a4f0608644432908a32f5e9840525b2236f8e
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: SPARK_DASHBOARD_PORT
              value: "3000"
            - name: SPARK_DASHBOARD_BIND
              value: "0.0.0.0"
            - name: SPARK_DASHBOARD_POLL_INTERVAL
              value: "1000"
            - name: SPARK_DASHBOARD_STATE_DIR
              value: /var/lib/spark-dashboard
            - name: SPARK_DASHBOARD_ENABLE_LOG_VIEWER
              value: "true"
            - name: DOCKER_HOST
              value: unix:///run/docker-shim/docker.sock
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: utility
            - name: RUST_LOG
              value: "spark_dashboard=debug,info"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: state
              mountPath: /var/lib/spark-dashboard
            - name: docker-sock
              mountPath: /run/docker-shim
        - name: docker-shim
          image: python:3.13-alpine@sha256:7984cf56ceaddebe4fefeb75d64000b9f45d8b77b11a09b24524da6cdc3af0c8
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/docker-shim.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: docker-shim
              mountPath: /app
            - name: docker-sock
              mountPath: /run/docker-shim
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: spark-dashboard-pvc
        - name: docker-shim
          configMap:
            name: docker-shim
        - name: docker-sock
          emptyDir: {}
