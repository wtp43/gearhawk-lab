apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spark-dashboard

resources:
  - ns.yaml
  - spark-dashboard-pvc.yaml
  - deployment.yaml
  - spark-dashboard-svc.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: spark-dashboard
      app.kubernetes.io/component: monitoring
      app.kubernetes.io/instance: spark-dashboard
