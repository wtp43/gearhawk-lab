apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spark-dashboard

configMapGenerator:
  - name: docker-shim
    files:
      - docker-shim.py

resources:
  - ns.yaml
  - service-account.yaml
  - spark-dashboard-pvc.yaml
  - deployment.yaml
  - spark-dashboard-svc.yaml
  - engine-watcher.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: spark-dashboard
      app.kubernetes.io/component: monitoring
      app.kubernetes.io/instance: spark-dashboard
