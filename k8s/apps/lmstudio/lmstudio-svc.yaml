apiVersion: v1
kind: Service
metadata:
  name: lmstudio-svc
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  selector:
    app: lmstudio
  ports:
    # Kept on 1234 rather than the usual 80 so that
    # `kubectl port-forward -n lmstudio svc/lmstudio-svc 1234:1234` yields a working
    # http://localhost:1234/v1 base URL with no port rewriting.
    - name: http
      protocol: TCP
      port: 1234
      targetPort: 1234
  sessionAffinity: None
