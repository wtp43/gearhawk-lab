# Same 1Password item as k8s/infra/database/cnpg-kaneo/role-secrets.yaml.
# The chart reads DATABASE_URL from its "uri" field.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: kaneo-owner
  namespace: kaneo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  itemPath: "vaults/gearhawk-k8s/items/kaneo-owner"
type: kubernetes.io/basic-auth
