# 1Password item "kaneo-app" (vault gearhawk-k8s), consumed via envFrom, so each
# field label is the env var name. Required fields:
#   AUTH_SECRET                         openssl rand -hex 32 (keep stable)
#   NOTIFICATION_SECRET_ENCRYPTION_KEY  openssl rand -hex 32 (keep stable)
#   S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY
#                                       R2 token scoped to the kaneo-uploads bucket
#   GITHUB_APP_ID, GITHUB_APP_NAME (app slug), GITHUB_WEBHOOK_SECRET,
#   GITHUB_PRIVATE_KEY_BASE64           GitHub App for issue/PR sync
#   GITHUB_OAUTH_CLIENT_ID, GITHUB_OAUTH_CLIENT_SECRET
#                                       GitHub OAuth App: Kaneo will not connect a
#                                       repo until the user has linked a GitHub account
# Optional (deferred SMTP via Plunk, like solidtime):
#   SMTP_HOST, SMTP_PORT, SMTP_SECURE, SMTP_USER, SMTP_PASSWORD, SMTP_FROM
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: kaneo-app
  namespace: kaneo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  itemPath: "vaults/gearhawk-k8s/items/kaneo-app"
