apiVersion: apps/v1
kind: Deployment
metadata:
  name: solidtime
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: solidtime
  template:
    metadata:
      labels:
        app: solidtime
    spec:
      containers:
        - name: solidtime
          image: solidtime/solidtime:0.19.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: solidtime-config
            - secretRef:
                name: solidtime-app
          env:
            - name: CONTAINER_MODE
              value: http
            - name: AUTO_DB_MIGRATE
              value: "true"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: solidtime-owner
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: solidtime-owner
                  key: password
          readinessProbe:
            httpGet:
              path: /up
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /up
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
