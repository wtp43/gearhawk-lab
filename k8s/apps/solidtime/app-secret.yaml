# 1Password item "solidtime-app" (vault gearhawk-k8s), consumed via envFrom.
# Required fields (generated by `php artisan self-host:generate-keys`):
#   APP_KEY, PASSPORT_PRIVATE_KEY, PASSPORT_PUBLIC_KEY
# Added after bootstrap (from `php artisan passport:client --personal`):
#   PASSPORT_PERSONAL_ACCESS_CLIENT_ID, PASSPORT_PERSONAL_ACCESS_CLIENT_SECRET
# Optional (deferred SMTP via Plunk; same key api-gearhawk uses as PLUNK_KEY):
#   MAIL_MAILER=smtp, MAIL_HOST=smtp.useplunk.com, MAIL_PORT=587,
#   MAIL_USERNAME=plunk, MAIL_PASSWORD=<plunk key>, MAIL_FROM_ADDRESS
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: solidtime-app
  namespace: solidtime
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  itemPath: "vaults/gearhawk-k8s/items/solidtime-app"
