apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-openai
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-openai
  template:
    metadata:
      labels:
        app: vllm-openai
    spec:
      runtimeClassName: nvidia
      # nodeSelector rather than nodeName: nodeName bypasses the scheduler, which would
      # skip nvidia.com/gpu accounting and let this pod land on the GPU alongside
      # vllm-server. With the resource request below, the scheduler guarantees only one
      # of the two holds the single RTX 3090 at a time.
      nodeSelector:
        kubernetes.io/hostname: work-00
      imagePullSecrets:
        - name: docker-secret
      containers:
        - name: vllm-openai
          image: ghcr.io/syv-ai/hyperqwen:sha-3acb93f@sha256:f761ce93d19e6c5a5dfbfb36d8eb98bf7f52fd09cd456465ed14ffcc673b0ffe
          imagePullPolicy: IfNotPresent
          args: ["batch"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: VISION
              value: "1"
            # Off: reusing a cached prefix shifted discovery answers vs a fresh
            # prefill (2026-10-06). From vLLM 0.28 hybrids cache by default, so
            # EXTRA_ARGS carries --no-enable-prefix-caching; =0 alone only drops align.
            - name: PREFIX_CACHE
              value: "0"
            - name: VISION_OFFLOAD
              value: "0"
            # VISION=1 makes start_qwen.sh hardcode --limit-mm-per-prompt image
            # count 1. EXTRA_ARGS is expanded after it, so raising it here is the
            # supported override; drop this and multi-image prompts silently cap at 1.
            - name: EXTRA_ARGS
              value: '--served-model-name qwen3.8-27b --limit-mm-per-prompt {"image":{"count":4}} --disable-access-log-for-endpoints /health,/metrics,/ping --no-enable-prefix-caching'
          resources:
            limits:
              nvidia.com/gpu: 1
          # First boot pulls a 9.5GB image, downloads + requantizes the model, and
          # JIT-compiles kernels; startupProbe gates liveness so it can take ~1h.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            failureThreshold: 240
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: vllm-openai-data
              mountPath: /app/models
              subPath: syv-models
            - name: vllm-openai-data
              mountPath: /cache
              subPath: syv-cache
            - name: dshm
              mountPath: /dev/shm
            - name: dockerenv
              mountPath: /.dockerenv
              subPath: .dockerenv
              readOnly: true
      volumes:
        - name: vllm-openai-data
          persistentVolumeClaim:
            claimName: vllm-openai-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: dockerenv
          configMap:
            name: vllm-openai-dockerenv
