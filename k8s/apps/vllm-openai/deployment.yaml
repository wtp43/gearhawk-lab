apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-openai
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-openai
  template:
    metadata:
      labels:
        app: vllm-openai
    spec:
      runtimeClassName: nvidia
      # nodeSelector rather than nodeName: nodeName bypasses the scheduler, which would
      # skip nvidia.com/gpu accounting and let this pod land on the GPU alongside
      # vllm-server. With the resource request below, the scheduler guarantees only one
      # of the two holds the single RTX 3090 at a time.
      nodeSelector:
        kubernetes.io/hostname: work-00
      imagePullSecrets:
        - name: docker-secret
      containers:
        - name: vllm-openai
          image: ghcr.io/syv-ai/qwen38-27b-rtx3090:latest@sha256:232b7b6bb19ef1c2d19965667f4fb166bfe4ea42b2c42e86ba34ee1dba623dda
          imagePullPolicy: IfNotPresent
          args: ["batch"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: VISION
              value: "1"
            - name: EXTRA_ARGS
              value: "--served-model-name qwen3.8-27b"
          resources:
            limits:
              nvidia.com/gpu: 1
          # First boot pulls a 9.5GB image, downloads + requantizes the model, and
          # JIT-compiles kernels; startupProbe gates liveness so it can take ~1h.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            failureThreshold: 240
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: vllm-openai-data
              mountPath: /app/models
              subPath: syv-models
            - name: vllm-openai-data
              mountPath: /cache
              subPath: syv-cache
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: vllm-openai-data
          persistentVolumeClaim:
            claimName: vllm-openai-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
