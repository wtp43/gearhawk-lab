apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-openai
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-openai
  template:
    metadata:
      labels:
        app: vllm-openai
    spec:
      runtimeClassName: nvidia
      # nodeSelector rather than nodeName: nodeName bypasses the scheduler, which would
      # skip nvidia.com/gpu accounting and let this pod land on the GPU alongside
      # vllm-server. With the resource request below, the scheduler guarantees only one
      # of the two holds the single RTX 3090 at a time.
      nodeSelector:
        kubernetes.io/hostname: work-00
      imagePullSecrets:
        - name: docker-secret
      containers:
        - name: vllm-openai
          image: vllm/vllm-openai:nightly@sha256:045ede572515526c6dc1f4380ba6b988736adc3769db61cc3ce4ff3cca226ed8
          imagePullPolicy: IfNotPresent
          args:
            - --model=cyankiwi/gemma-4-26B-A4B-it-qat-AWQ-INT4
            - --served-model-name
            - gemma-4-26b-a4b
            - qwen3.5-9b
            - --host=0.0.0.0
            - --port=8000
            - --reasoning-parser=gemma4
            - --tensor-parallel-size=1
            - --max-model-len=32768
            - --max-num-batched-tokens=4096
            - --gpu-memory-utilization=0.94
            - --kv-cache-dtype=int4_per_token_head
            - --max-num-seqs=16
            - --enable-prefix-caching
            - --limit-mm-per-prompt.image=3
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HF_HOME
              value: "/data/hf"
            - name: VLLM_USE_FLASHINFER_SAMPLER
              value: "1"
          resources:
            limits:
              nvidia.com/gpu: 1
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            failureThreshold: 160
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: vllm-openai-data
              mountPath: /data
            # vLLM uses shared memory for its worker IPC; the 64 MB default is not enough.
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: vllm-openai-data
          persistentVolumeClaim:
            claimName: vllm-openai-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
