apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-dashboard-logs
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-dashboard-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-dashboard-logs
subjects:
  - kind: ServiceAccount
    name: spark-dashboard
    namespace: spark-dashboard
