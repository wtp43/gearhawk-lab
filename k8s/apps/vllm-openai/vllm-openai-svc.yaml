apiVersion: v1
kind: Service
metadata:
  name: vllm-openai-svc
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  selector:
    app: vllm-openai
  ports:
    # Kept on vLLM's native 8000 rather than the repo's usual 80 so that
    # `kubectl port-forward -n vllm-openai svc/vllm-openai-svc 8000:8000` yields a
    # working http://localhost:8000/v1 OpenAI base URL with no port rewriting.
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
  sessionAffinity: None
