apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-openai-pvc
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # The w4a16 weights are ~11.5 GB; the rest is headroom for swapping models
      # without having to resize the volume.
      storage: 50Gi
  storageClassName: no-replicas
  volumeMode: Filesystem
