apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-dashboard-engine-watcher
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-dashboard-engine-watcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-dashboard-engine-watcher
subjects:
  - kind: ServiceAccount
    name: engine-watcher
    namespace: spark-dashboard
