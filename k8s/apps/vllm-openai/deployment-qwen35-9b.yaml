apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-openai
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-openai
  template:
    metadata:
      labels:
        app: vllm-openai
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: work-00
      containers:
        - name: vllm-openai
          image: vllm/vllm-openai:v0.31.0@sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3
          imagePullPolicy: IfNotPresent
          # Same serving settings as the hyperqwen batch deployment, so prefill compares like for like.
          args:
            - RedHatAI/Qwen3.5-9B-quantized.w4a16
            - --served-model-name=qwen3.5-9b-w4a16
            - --host=0.0.0.0
            - --port=8000
            - --gpu-memory-utilization=0.94
            - --max-model-len=150000
            - --max-num-seqs=64
            - --max-num-batched-tokens=2048
            - --async-scheduling
            - --limit-mm-per-prompt={"image":{"count":4}}
            - --mm-processor-kwargs={"size":{"shortest_edge":65536,"longest_edge":2097152}}
            - --kv-cache-dtype=fp8
            - --mamba-ssm-cache-dtype=float16
            - --enable-prefix-caching
            - --mamba-cache-mode=align
            - --compilation-config={"max_cudagraph_capture_size":64,"custom_ops":["+rms_norm","+silu_and_mul"]}
            - --reasoning-parser=qwen3
            - --enable-prompt-tokens-details
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HF_HOME
              value: /cache/huggingface
            - name: VLLM_CACHE_ROOT
              value: /cache/vllm
          resources:
            limits:
              nvidia.com/gpu: 1
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            failureThreshold: 240
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: vllm-openai-data
              mountPath: /cache
              subPath: syv-cache
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: vllm-openai-data
          persistentVolumeClaim:
            claimName: vllm-openai-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
