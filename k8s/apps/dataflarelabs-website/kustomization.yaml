apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dataflarelabs-website

resources:
  - ns.yaml
  - docker-secret.yaml
  - deployment.yaml
  - service.yaml
  - external-route.yaml
  - www-redirect-route.yaml
  - pdb.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: dataflarelabs-website
      app.kubernetes.io/part-of: dataflarelabs
      app.kubernetes.io/component: web
      app.kubernetes.io/instance: dataflarelabs-website
