# www.dataflarelabs.com -> dataflarelabs.com (301). Served by the wildcard
# listener on the external gateway; no backend is reached.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dataflarelabs-website-www-redirect
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  parentRefs:
    - name: external
      namespace: gateway
  hostnames:
    - www.dataflarelabs.com
  rules:
    # Cilium does not route a rule carrying only filters, so the match is
    # explicit even though "/" is the spec default.
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: dataflarelabs.com
            statusCode: 301
