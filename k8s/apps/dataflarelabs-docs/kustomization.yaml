apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dataflarelabs-docs

resources:
  - ns.yaml
  - docker-secret.yaml
  - deployment.yaml
  - service.yaml
  - external-route.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: dataflarelabs-docs
      app.kubernetes.io/part-of: dataflarelabs
      app.kubernetes.io/component: docs
      app.kubernetes.io/instance: dataflarelabs-docs
